<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPad Wallpaper</title>
  <link rel="stylesheet" href="/ipad/ipad_wall.css">
</head>
<body>
  <div class="container">
    <div class="black-box">
      <div class="back-img">
        <div class="display">
          <div class="time-battery">
            <div>21-07 Fri Jan 2025</div>
            <div class="signal-battery">
              <img src="/icons/VOLTE-512.webp" alt="">
              <img src="/icons/signal.png" alt="">
              <img src="/icons/signal.png" alt="">
              <img src="/icons/full-battery.png" alt="">
              <p>100%</p>
            </div>
          </div>
          <div class="app-bar1">
            <div class="div1">
              <img src="/icons/amazon.png" alt="">
              Amazon
            </div>
            <div class="div1">
              <img src="/icons/camera.png" alt="">
              Camera
            </div>
            <div class="div1">
              <img src="/icons/chat-gpt.png" alt="">
              Chat-gpt
            </div>
            <div class="div1">
              <img src="/icons/chrome.png" alt="">
              Chrome
            </div>
            <div class="div1">
              <img src="/icons/clock.png" alt="">
              Clock
            </div>
            <div class="div1">
              <img src="/icons/drive.png" alt="">
              Drive
            </div>
          </div>

          <div class="app-bar2">
            <div class="div1">
              <img src="/icons/facebook.png" alt="">
              Facebook
            </div>
            <div class="div1">
              <img src="/icons/google-pay.png" alt="">
              GPay
            </div>
            <div class="div1">
              <img src="/icons/google-photos.png" alt="">
              Photos
            </div>
            <div class="div1">
              <img src="/icons/google.png" alt="">
              Google
            </div>
            <div class="div1">
              <img src="/icons/instagram.png" alt="">
              Instagram
            </div>
            <div class="div1">
              <img src="/icons/linkedin-logo.png" alt="">
              LinkedIn
            </div>
          </div>

          <div class="app-bar3">
            <div class="div1">
              <img src="/icons/maps.png" alt="">
              Maps
            </div>
            <div class="div1">
              <img src="/icons/Messages.png" alt="">
              Messages
            </div>
            <div class="div1">
              <img src="/icons/music.png" alt="">
              Music
            </div>
            <div class="div1">
              <img src="/icons/paytm.png" alt="">
              Paytm
            </div>
            <div class="div1">
              <img src="/icons/phone-call.png" alt="">
              Phone
            </div>
            <div class="div1">
              <img src="/icons/pinterest-logo.png" alt="">
              Pinterest
            </div>
          </div>

          <div class="app-bar4">
            <div class="div2">
              <img src="/icons/playstore.png" alt="">
              Play Store
            </div>
            <div class="div2">
              <img src="/icons/reddit.png" alt="">
              Reddit
            </div>
          </div>

          <div class="white-dot-div">
            <p class="left-dot">&#9898;</p>
            <p class="right-dot">&#9898;</p>
          </div>

          <div class="menu">
            <div class="menu-bar">
              <img src="/icons/settings.png" alt="">
              <img src="/icons/snapchat.png" alt="">
              <img src="/icons/telegram.png" alt="">
              <img src="/icons/tinder.png" alt="">
              <img src="/icons/twitter.png" alt="">
              <img src="/icons/weather.png" alt="">
              <img src="/icons/whatsapp.png" alt="">
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</body>
</html>
