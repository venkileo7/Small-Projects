<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/calculator/calculator.css">
  <title>Calculator</title>
</head>
<body>
  <div class="container">
    <input type="text" id="inputbox" placeholder="0">
    <div>
      <button class="specialbtn">AC</button>
      <button class="specialbtn">%</button>
      <button class="specialbtn">DEL</button>
      <button class="specialbtn">/</button>
    </div>
    <div>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="specialbtn">*</button>
    </div>
    <div>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="specialbtn">-</button>
    </div>
    <div>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="specialbtn">+</button>
    </div>
    <div>
      <button>00</button>
      <button>0</button>
      <button>.</button>
      <button class="equalbtn">=</button>
    </div>
  </div>

  <script src="/calculator/calculator.js"></script>
</body>
</html>
